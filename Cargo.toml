[package]
name = "swiftdns"
version = "0.16.3"
authors = ["chris9740"]
edition = "2021"
description = "Local DNS resolver with DoH, Tor routing, and privacy filtering"
license-file = "LICENSE"
build = "build.rs"

[profile.dev]
lto = false
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
panic = "abort"

[profile.release]
strip = true
lto = "thin"
codegen-units = 128

[dependencies]
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
clap = { version = "4.0", features = ["derive", "cargo"] }
reqwest = { version = "0.11", default-features = false, features = [
    "socks",
    "rustls-tls",
] }
serde = { version = "1.0.159", default-features = false, features = ["derive"] }
hickory-proto = { version = "0.25.2", default-features = false }
bytes = "1.4.0"
wildmatch = "2.1.1"
tabwriter = "1.2.1"
idna = "0.4.0"
anyhow = "1.0.72"
colored = "2.0.4"
toml = "0.8.22"
thiserror = "2.0.12"
tokio-rustls = "0.24"
rustls-native-certs = "0.6"
url = "2.5.4"
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.19", optional = true }
notify = { version = "8.0.0", optional = true }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tokio-test = "0.4.4"

[features]
default = ["notify"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
notify = ["dep:notify"]

[package.metadata.deb]
revision = ""
maintainer-scripts = "assets/debian/"
systemd-units = { enable = true }
assets = [
    [
        "target/release/swiftdns",
        "/usr/bin/",
        "755",
    ],
    [
        "assets/filters/whitelist.list",
        "/etc/swiftdns/filters/whitelist.list",
        "644",
    ],
]
conf-files = [
    "/etc/swiftdns/config.toml",
    "/etc/swiftdns/filters/whitelist.list",
]
