name: E2E Testing

on:
    push:
        branches: [master]

    release:
        types: [published]

    workflow_dispatch:

    pull_request:
        branches: [master]
        paths:
            - "src/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - "tests/e2e/**"

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  profile: minimal
                  override: true

            - name: Install system dependencies
              run: |
                  apt-get update
                  apt-get install -y clang mold tor dnsutils

            - name: Install Robot Framework
              run: |
                  pip install --break-system-packages robotframework

            - name: Prepare cargo config
              run: |
                  sed -i '/\[build\]/,+1d' .cargo/config.toml

            - name: Build binary
              run: |
                  cargo build

            - name: Run E2E tests
              run: |
                  make e2e-test

            # - name: Upload test results
            #   uses: actions/upload-artifact@v3
            #   if: always()
            #   with:
            #       name: robot-results
            #       path: tests/robot/results/
