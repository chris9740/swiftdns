name: E2E Testing

on:
    push:
        branches: [master, revision, e2e]
    pull_request:
        branches: [master, revision, e2e]
        paths:
            - "src/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - "tests/e2e/**"

    release:
        types: [published]
    workflow_dispatch:

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust
              if: env.ACT != 'true'
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  profile: minimal
                  override: true

            - name: Install system dependencies
              if: env.ACT != 'true'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang mold tor dnsutils

            - name: Install Robot Framework
              if: env.ACT != 'true'
              run: |
                  pip install robotframework

            - name: Prepare cargo config
              run: |
                  sed -i '/\[build\]/,+1d' .cargo/config.toml

            - name: Build binary
              run: |
                  cargo build

            - name: Run E2E tests
              run: |
                  make e2e-test

            - name: Upload test results
              uses: actions/upload-artifact@v3
              if: always() && env.ACT != 'true'
              with:
                  name: robot-results
                  path: tests/robot/results/
